<!DOCTYPE html>
<html lang="en">
<head>
    <title>ColorTris - Falling Blocks Game</title>
        <link rel="stylesheet" href="design.css">

</head>
<body>
    <header>
        <h1>COLORTRIS - FALLING BLOCKS</h1>
        <div class="sound-control">
            <button id="muteButton">🔊</button>
        </div>
    </header>
    
    <div class="game-container">
        <div class="game-area">
            <h1 id="LS">GAME OVER</h1>
            <h1 id="WS">NEW BEST SCORE!</h1>
            <div id="Main"></div>
        </div>
        
        <div class="controls">
            <button id="playButton">PLAY GAME</button>
            
            <div class="button-row">
                <button id="LButton" class="control-button">←</button>
                <button id="RotateButton" class="control-button">↻</button>
                <button id="DButton" class="control-button">↓</button>
                <button id="RButton" class="control-button">→</button>
            </div>
            
            <button id="Exit">END GAME</button>
            
            <div id="Info">
                <p id="BScore">Best Score: 0</p>
                <p id="score">Score: 0</p>
            </div>
            
            <div class="instructions">
                <p><strong>How to Play:</strong></p>
                <p>← → : Move blocks left/right</p>
                <p>↓ : Move block down faster</p>
                <p>↻ : Rotate block</p>
                <p>Complete rows to earn points!</p>
            </div>
        </div>
    </div>
        <script src="main.js"></script>

</body>
</html>
